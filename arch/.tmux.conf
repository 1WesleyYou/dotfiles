# run 'cut -c3- ~/.tmux.conf | sh -s _apply_configuration'
# 初始化 tpm 插件管理器
set -g @plugin 'tmux-plugins/tpm'

# catppuccin 主题和其他插件
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-battery'

set -gq allow-passthrough on
set -g visual-activity off
set -gq terminal-overrides 'xterm-kitty:RGB'

set -gq history-limit 5000

# tmux-battery 通过对 status-* 做字符串替换的方式把 #{battery_*} 占位符变成实际命令,
# 所以必须等 status-right 设置好之后再运行 (见文件末尾)。
# 设置 catppuccin flavor (可选: latte, frappe, macchiato, mocha)
set -g @catppuccin_flavor 'frappe'

# 按照 catppuccin 主题刷新设置
set -g status-left-length "100"
set -g status-right-length "100"

# 其他选项
set -g @catppuccin_pane_status_enabled "yes"
# set -g @catppuccin_pane_border_status "bottom"
set -g @catppuccin_pane_left_separator "█"
set -g @catppuccin_pane_middle_separator "█"
set -g @catppuccin_pane_right_separator "█"

set -g @catppuccin_window_right_separator "█ "
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_middle_separator " | "

set -g @catppuccin_window_default_fill "none"

set -g @catppuccin_window_current_fill "all"
set -g @catppuccin_gitmux_text "#(gitmux -cfg $HOME/.gitmux.conf \"#{pane_current_path}\")"

# 设置状态栏模块
#set -g @catppuccin_status_modules_right "application battery cpu date_time"


set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# === 状态栏: 加载 catppuccin 主题, 然后拼接模块 ===
# 必须在设置 status-right/left 之前显式加载主题, 这样所有 @catppuccin_status_* 变量才有定义。
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# 自定义模块
source /home/whoami/.config/tmux/modules/wttr.conf

# Battery 图标用 FA BMP 字符（替代默认 MDI supplementary plane，渲染更稳）
set -gq @batt_icon_charge_tier8 ""   # 100% full
set -gq @batt_icon_charge_tier7 ""
set -gq @batt_icon_charge_tier6 ""   # ~75% three-quarters
set -gq @batt_icon_charge_tier5 ""
set -gq @batt_icon_charge_tier4 ""   # ~50% half
set -gq @batt_icon_charge_tier3 ""
set -gq @batt_icon_charge_tier2 ""   # ~25% quarter
set -gq @batt_icon_charge_tier1 ""   # empty
set -gq @batt_icon_status_charged ""   # plug
set -gq @batt_icon_status_charging ""   # bolt
set -gq @batt_icon_status_discharging ""   # half battery (icon for active discharge state)
set -gq @batt_icon_status_unknown ""   # question
set -gq @batt_icon_status_attached ""   # warning
