# Hyprland configuration — GA403WP
# Wiki: https://wiki.hyprland.org/

source = ~/.config/hypr/mocha.conf

################
### MONITORS ###
################
# Internal OLED: 2880×1800 @ 120Hz, scale 1.6 for sane font size on high-DPI
# These are fallback defaults; nwg-displays writes ~/.config/hypr/monitors.conf which is sourced below and overrides.
monitor = eDP-2, 2880x1800@120, 0x0, 1.6
monitor = , preferred, auto, 1
source = ~/.config/hypr/monitors.conf


###################
### MY PROGRAMS ###
###################
$terminal    = kitty
$fileManager = dolphin
$menu        = rofi -show drun


#############################
### ENVIRONMENT VARIABLES ###
#############################
# Cursor theme + size
env = HYPRCURSOR_THEME, Bibata-Modern-Amber
env = HYPRCURSOR_SIZE,  24
env = XCURSOR_THEME,    Bibata-Modern-Amber
env = XCURSOR_SIZE,     24
env = XCURSOR_PATH,     /home/whoami/.local/share/icons/

# Wayland app adapters
env = MOZ_ENABLE_WAYLAND,           1                      # Firefox → Wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto                   # Electron → Wayland
env = QT_QPA_PLATFORMTHEME,         qt6ct                  # Qt theming
env = _JAVA_AWT_WM_NONREPARENTING,  1                      # Java GUI fixes
env = GDK_BACKEND,                  wayland,x11            # GTK prefers Wayland, falls back to X11
env = SDL_VIDEODRIVER,              wayland                # SDL apps → Wayland


#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in  = 5
    gaps_out = 20
    border_size = 2
    col.active_border   = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing    = false
    layout = dwindle
}

decoration {
    rounding       = 10
    rounding_power = 2
    active_opacity   = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled      = true
        range        = 4
        render_power = 3
        color        = rgba(1a1a1aee)
    }
    blur {
        enabled       = true
        size          = 8
        passes        = 3
        new_optimizations = true
        ignore_opacity = true
        xray          = false
        noise         = 0.02
        contrast      = 1.1
        brightness    = 0.95
        vibrancy      = 0.25
    }
}

animations {
    enabled = yes, please :)
    bezier = easeOutQuint,    0.23, 1, 0.32, 1
    bezier = easeInOutCubic,  0.65, 0.05, 0.36, 1
    bezier = linear,          0, 0, 1, 1
    bezier = almostLinear,    0.5, 0.5, 0.75, 1.0
    bezier = quick,           0.15, 0, 0.1, 1
    animation = global,          1, 10,   default
    animation = border,          1, 5.39, easeOutQuint
    animation = windows,         1, 4.79, easeOutQuint
    animation = windowsIn,       1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,      1, 1.49, linear,       popin 87%
    animation = fadeIn,          1, 1.73, almostLinear
    animation = fadeOut,         1, 1.46, almostLinear
    animation = fade,            1, 3.03, quick
    animation = layers,          1, 3.81, easeOutQuint
    animation = layersIn,        1, 4,    easeOutQuint, fade
    animation = layersOut,       1, 1.5,  linear,       fade
    animation = fadeLayersIn,    1, 1.79, almostLinear
    animation = fadeLayersOut,   1, 1.39, almostLinear
    animation = workspaces,      1, 1.94, almostLinear, fade
    animation = workspacesIn,    1, 1.21, almostLinear, fade
    animation = workspacesOut,   1, 1.94, almostLinear, fade
}

dwindle {
    # pseudotile removed in 0.55 (no-op); use the `pseudo` dispatcher per-window
    preserve_split  = true
}

misc {
    force_default_wallpaper = 0      # disable anime mascot
    disable_hyprland_logo   = true   # disable watermark (using mpvpaper)
}


#############
### INPUT ###
#############
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

# gestures: workspace_swipe option removed in 0.55. Use `gesture = <fingers>, <direction>, <dispatcher>` to bind a gesture if desired. Leaving unbound = disabled.


###################
### KEYBINDINGS ###
###################
$mainMod = LALT

# --- Core window ops ---
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo,
bind = $mainMod SHIFT, J, layoutmsg, togglesplit

# --- Launchers / menus ---
bind = $mainMod, D, exec, $menu
bind = Alt, Space, exec, $menu
bind = $mainMod, M, exec, rofi -modi power:rofi-power-menu -show power
bind = $mainMod, B, exec, rofi-bluetooth
bind = $mainMod, W, exec, networkmanager_dmenu
bind = $mainMod, A, exec, ~/.config/hypr/scripts/audio-switch.sh
bind = $mainMod, C, exec, gnome-clocks

# --- Workspace cycling ---
bind = Alt, Tab, workspace, e+1
bind = Alt SHIFT, Tab, workspace, e-1

# --- Move focus (hjkl + arrows) ---
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# --- Workspaces 1-10 ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# --- Move active window to workspace ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- Special workspaces (scratchpads) ---
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# --- macOS-style hide: stash current window into a hidden scratchpad ---
bind = $mainMod, H, movetoworkspacesilent, special:hidden
bind = $mainMod SHIFT, H, togglespecialworkspace, hidden

# --- Toggle hyprpanel bar (Zen mode) ---
bind = $mainMod, Z, exec, ~/.config/hypr/scripts/toggle-panel.sh

# --- Screenshots (hyprshot) ---
bind = , Print,                exec, hyprshot -m output     # whole screen
bind = SHIFT, Print,           exec, hyprshot -m region     # region
bind = $mainMod, Print,        exec, hyprshot -m window     # active window

# --- Clipboard history (cliphist + rofi) ---
bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu -p "📋" | cliphist decode | wl-copy

# --- Blue light filter toggle (hyprsunset 4500K) ---
bind = $mainMod SHIFT, L, exec, pkill hyprsunset || hyprsunset -t 4500 &

# --- Workspace scroll with mouse ---
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# --- Move/resize windows with mouse + modifier ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Laptop multimedia keys ---
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume      @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute        @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute        @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# --- Media player keys (requires playerctl) ---
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################
# Ignore maximize requests from apps
windowrule = suppress_event maximize class:.*

# Fix dragging issues with XWayland
windowrule = no_focus class:^$ title:^$ xwayland:1 floating:1 fullscreen:0 pinned:0

# --- Layer rules: rofi popup animation + blur ---
layerrule = animation popin 80% ^(rofi)$
layerrule = blur                ^(rofi)$
layerrule = ignore_alpha 0.0, match:namespace ^(rofi)$

# --- Layer rules: notification slide-in ---
layerrule = animation slide     ^(notifications)$
layerrule = blur                ^(notifications)$

# --- Layer rules: hyprpanel bar + notifications (frosted glass) ---
layerrule = blur                ^(bar-0)$
layerrule = ignore_alpha 0.3,   match:namespace ^(bar-0)$
layerrule = blur                ^(notifications-window)$
layerrule = ignore_alpha 0.3,   match:namespace ^(notifications-window)$
layerrule = blur                ^(indicator)$


#################
### AUTOSTART ###
#################
# Core daemons
# Replaced by hyprpanel (bar + notifications + OSDs)
# exec-once = waybar
# exec-once = dunst
exec-once = hyprpanel
exec-once = nwg-dock-hyprland -d
exec-once = rog-control-center --start-in-tray

exec-once = fcitx5 --replace -d
exec-once = hypridle
# Auto-disable eDP-2 on external connect; nwg-displays for fine tuning afterwards
exec-once = ~/.config/hypr/scripts/monitor-hotplug.sh
exec-once = systemctl --user start hyprpolkitagent

# Clipboard history listener (cliphist)
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Cursor theme propagation to GTK
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Amber'
exec-once = gsettings set org.gnome.desktop.interface cursor-size  24

# Video wallpaper (mpvpaper, hardware-decoded)
# -p: pause when wallpaper is hidden by a fullscreen window
# --input-ipc-server: socket for the AC pause script to control playback
exec-once = mpvpaper -p -o "--loop --no-audio --hwdec=auto --vo=gpu-next --keepaspect=yes --panscan=1.0 --no-border --input-ipc-server=/tmp/mpvpaper-socket" ALL $HOME/Videos/kei-sunset-blue-archive-moewalls-com.mp4
exec-once = $HOME/.config/hypr/scripts/mpvpaper-ac-pause.sh
